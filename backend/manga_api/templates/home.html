<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manga Reader API</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #f1f1f1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      animation: fadeIn 1.5s ease-in;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      animation: slideDown 1s ease-in-out;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 40px;
      color: #ccc;
    }

    .button-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 15px 25px;
      border: none;
      border-radius: 10px;
      background: #00c6ff;
      color: #000;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
      text-decoration: none;
    }

    .btn:hover {
      background: #0072ff;
      transform: scale(1.05);
      color: white;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes slideDown {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>📚 Manga Reader Backend</h1>
  <p>Navigate to API routes:</p>

  <div class="button-container">
    <a href="/api/" class="btn">🔍 API Docs</a>
    <a href="/api/token/" class="btn">🔑 Login Token</a>
    <a href="/api/token/refresh/" class="btn">♻️ Refresh Token</a>
  </div>
</body>
</html>
